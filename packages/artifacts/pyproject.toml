[project]
name = "dockflow-artifacts"
version = "0.1.0.dev0"
description = "Reusable immutable artifact publication and orchestration integration"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Dockflow contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.optional-dependencies]
s3 = ["boto3>=1.40,<2"]
kfp = ["kfp>=2.17.0,<2.18"]

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"
