[project]
name = "dockflow-artifacts"
version = "0.1.1"
description = "Reusable immutable artifact publication and orchestration integration"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Dockflow contributors"}]
dependencies = ["dockflow-database==0.1.1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/dockflow-project/dockflow"
Documentation = "https://github.com/dockflow-project/dockflow/blob/main/docs/artifact-library/README.md"
Issues = "https://github.com/dockflow-project/dockflow/issues"
Changelog = "https://github.com/dockflow-project/dockflow/blob/main/CHANGELOG.md"

[project.optional-dependencies]
postgresql = ["dockflow-database[postgresql]==0.1.1"]
s3 = ["boto3>=1.40,<2", "certifi>=2026.10.19,<2027"]
kfp = ["kfp>=2.17.0,<2.18", "certifi>=2026.10.19,<2027"]

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
dockflow-database = { workspace = true }
