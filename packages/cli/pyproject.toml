[project]
name = "dockflow-cli"
version = "0.3.0"
description = "Dockflow extensible command host"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["dockflow-core==0.3.0", "typer>=0.27.3,<0.28.0"]

[project.urls]
Homepage = "https://github.com/dockflow-project/dockflow"
Documentation = "https://github.com/dockflow-project/dockflow/blob/main/docs/README.md"
Issues = "https://github.com/dockflow-project/dockflow/issues"
Changelog = "https://github.com/dockflow-project/dockflow/blob/main/CHANGELOG.md"

[project.scripts]
dockflow = "dockflow_cli.main:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
dockflow-core = { workspace = true }
