[project]
name = "dockflow-database"
version = "0.2.0"
description = "Shared SQLite and PostgreSQL persistence for Dockflow"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.3.6,<4"]

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"
