schema_version: 1
id: deletion-and-storage-cleanup
summary: Add dependency-protected resource deletion, storage inventory and cleanup, manual-origin protection and optional retention.
origin:
  commit: "72f14612e6e9a791ce6c391e1c17a7c9a8d8fac4"
  specification: "specs-1.0.0"
  implementation: "imp-1.0.0"
impact:
  specification: major
  implementation: minor
deliverables:
  - dockflow-pipelines
  - dockflow-artifacts
requirements:
  - requirement: Pipelines 015 and A40.
    implementation: Shared dependency gate, journal-backed retirement, exact filesystem/S3 inventories, durable deletion jobs, UI/API/CLI adapters and optional protected retention.
    verification: Both supported interpreters, SQLite/PostgreSQL, real S3/Docker, browser flows, replay/backup, stale plans, lost acknowledgments and build checks.
evidence:
  - validation/deletion-and-storage-cleanup.md
gaps: []
delivery_limits:
  - Logical retirement preserves journal/provenance; secure erasure and physical database compaction are not implemented.
  - Storage maintenance requires an idle project and exclusive ownership; scans/apply are synchronous.
  - S3 object-lock and suspended-versioning buckets are refused; unversioned cleanup requires conditional-delete enforcement.
  - Feature acceptance, all-workflow closure and release authorized; actual publication remains an external gate.
